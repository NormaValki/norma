<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Статистика НОРМА</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{--red:#D7263D;--red-d:#B01E31;--yellow:#FFC72C;--yellow-l:#FFF3CC;--brick:#8F4130;--brick-l:#F6E7E0;--ink:#2B1612;--paper:#FFFBF7;--line:#F0E1D9;--muted:#8A6F66;--green:#2f8f4e}
*{box-sizing:border-box;margin:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:50px}
.top{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;padding:22px 16px 56px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--yellow);opacity:.9}
.in{max-width:1000px;margin:0 auto;position:relative;z-index:1}
.top h1{font-family:'Unbounded','Manrope',sans-serif;font-size:clamp(22px,5vw,30px);font-weight:800}
.top p{opacity:.9;margin-top:4px;font-size:14px}
main{max-width:1000px;margin:-34px auto 0;padding:0 16px;position:relative;z-index:2}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 40px -28px rgba(90,30,20,.5);margin-bottom:16px;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
h2{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brick);margin-bottom:12px}
label{display:block;font-weight:700;font-size:13px;color:var(--brick);margin:12px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--line);border-radius:14px;outline:0;background:#fff}
input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(215,38,61,.12)}
button{font:inherit;font-weight:800;border:0;cursor:pointer;border-radius:14px}
.pri{background:var(--red);color:#fff;padding:14px 18px;width:100%;margin-top:16px;font-size:16px}
.pri:hover{background:var(--red-d)}
.err{color:var(--red-d);font-weight:700;font-size:14px;margin-top:10px;min-height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--brick-l);color:var(--brick);padding:9px 15px;border-radius:99px;font-size:14px;transition:.2s}
.chip.on{background:var(--red);color:#fff}
.range{display:none;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px;align-items:end}
.range.show{display:grid}
.range label{margin:0 0 4px}.range button{background:var(--yellow);color:var(--brick);padding:13px 16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;animation:rise .5s both}
.kpi small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.kpi b{display:block;font-family:'Unbounded','Manrope',sans-serif;font-size:clamp(20px,5vw,28px);color:var(--red);margin-top:6px}
.kpi:nth-child(2) b{color:var(--brick)}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:600}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid2>*,.card,.kpi{min-width:0}
html,body{overflow-x:hidden}
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:10px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}
.col i{display:block;width:100%;max-width:34px;border-radius:7px 7px 0 0;background:linear-gradient(var(--red),var(--red-d));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;min-height:3px}
.col.y i{background:linear-gradient(var(--yellow),#f0a800)}
.col span{max-width:100%;overflow:hidden;font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:700;white-space:nowrap}
.col:hover::before{content:attr(data-t);position:absolute;bottom:100%;margin-bottom:4px;background:var(--ink);color:#fff;font-size:12px;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:3}
@keyframes grow{from{transform:scaleY(0)}}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14.5px;align-items:center}
.row:last-child{border:0}
.row .n{font-weight:800;white-space:nowrap}
.meter{height:7px;border-radius:9px;background:var(--brick-l);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--red));border-radius:9px;animation:w .8s both}
@keyframes w{from{width:0!important}}
.badge{font-size:12px;padding:4px 9px;border-radius:99px;font-weight:800;white-space:nowrap;background:var(--yellow-l);color:var(--brick)}
.badge.done,.badge.ready,.badge.accepted{background:#e3f5e9;color:var(--green)}
.badge.cancelled{background:#FFE4E7;color:var(--red-d)}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:26px 0;font-weight:600}
.tools{display:flex;gap:10px;margin-top:6px}
.tools button{background:var(--brick-l);color:var(--brick);padding:10px 14px;font-size:14px}
#app{display:none}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in"><h1>НОРМА · статистика</h1><p>Замовлення, виручка та улюблені страви гостей</p></div></div>
<main>
  <section class="card" id="login">
    <h2>Вхід</h2>
    <label for="api">Адреса Worker-а</label>
    <input id="api" type="url" inputmode="url" placeholder="https://norma-orders.ВАШ.workers.dev" autocomplete="off">
    <label for="key">Пароль (ADMIN_KEY)</label>
    <input id="key" type="password" placeholder="Ваш пароль до статистики" autocomplete="current-password">
    <button class="pri" id="go">Показати статистику</button>
    <div class="err" id="err"></div>
    <p class="muted">Пароль і адреса зберігаються лише в цьому браузері.</p>
  </section>

  <div id="app">
    <section class="card">
      <div class="chips" id="chips">
        <button class="chip on" data-d="0">Сьогодні</button><button class="chip" data-d="1">Вчора</button><button class="chip" data-d="7">7 днів</button><button class="chip" data-d="30">30 днів</button><button class="chip" data-d="m">Цей місяць</button><button class="chip" data-d="r">Період…</button>
      </div>
      <div class="range" id="range"><div><label for="f">Від</label><input id="f" type="date"></div><div><label for="t">До</label><input id="t" type="date"></div><button id="rgo">OK</button></div>
    </section>
    <div class="kpis" id="kpis"></div>
    <div class="grid2" style="margin-top:16px">
      <section class="card wide"><h2>Виручка по днях, ₴</h2><div id="days"></div></section>
      <section class="card"><h2>Топ страв</h2><div id="top"></div></section>
      <section class="card"><h2>Години замовлень</h2><div id="hours"></div></section>
      <section class="card"><h2>Тип замовлення</h2><div id="modes"></div></section>
      <section class="card"><h2>Оплата</h2><div id="pays"></div></section>
      <section class="card wide"><h2>Останні замовлення</h2><div id="recent"></div>
        <div class="tools"><button id="csv">Завантажити CSV по днях</button><button id="out">Вийти</button></div></section>
    </div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MODE={delivery:'🛵 Доставка',pickup:'🥡 Самовивіз',dine:'🍽️ У кафе'}, PAY={cash:'💵 Готівкою',card:'💳 Карткою',online:'📲 Онлайн'};
const ST={new:'Нове',accepted:'Прийнято',ready:'Готово',done:'Видано',cancelled:'Скасовано'};
const get=k=>{try{return localStorage.getItem('norma_adm_'+k)||''}catch(e){return ''}}, put=(k,v)=>{try{localStorage.setItem('norma_adm_'+k,v)}catch(e){}};
const ymd=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Kyiv'}).format(d);
const shift=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const fmt=n=>Number(n||0).toLocaleString('uk-UA').replace(/ /g,' ');
let range={from:'',to:''}, last=null;

function setRange(k){
  const today=ymd(new Date());
  if(k==='0')range={from:today,to:today}; else if(k==='1'){const y=shift(-1);range={from:y,to:y}}
  else if(k==='7')range={from:shift(-6),to:today}; else if(k==='30')range={from:shift(-29),to:today}
  else if(k==='m')range={from:today.slice(0,8)+'01',to:today};
}
async function load(){
  $('#err').textContent='';
  try{
    const base=get('api').replace(/\/$/,'');
    const r=await fetch(`${base}/stats?from=${range.from}&to=${range.to}`,{headers:{Authorization:'Bearer '+get('key')}});
    if(r.status===403){showLogin('Невірний пароль');return}
    if(!r.ok)throw new Error(r.status);
    last=await r.json(); $('#login').style.display='none'; $('#app').style.display='block'; render(last);
  }catch(e){ showLogin('Не вдалося підключитися. Перевірте адресу Worker-а.') }
}
function showLogin(msg){$('#app').style.display='none';$('#login').style.display='block';$('#err').textContent=msg||''}

function bars(items,{yellow}={}){
  if(!items.length)return '<div class="empty">Даних за цей період ще немає</div>';
  const max=Math.max(...items.map(i=>i.v),1);
  return `<div class="bars">${items.map((i,k)=>`<div class="col${yellow?' y':''}" data-t="${esc(i.t)}"><i style="height:${Math.max(2,i.v/max*86)}%;animation-delay:${Math.min(k,30)*18}ms"></i><span>${esc(i.l)}</span></div>`).join('')}</div>`;
}
function list(items,total){
  if(!items.length)return '<div class="empty">Даних за цей період ще немає</div>';
  const max=Math.max(...items.map(i=>i.v),1);
  return items.map(i=>`<div><div class="row"><span>${esc(i.l)}</span><span class="n">${i.r}</span></div><div class="meter" style="margin:-4px 0 6px"><i style="width:${i.v/max*100}%"></i></div></div>`).join('');
}
function render(s){
  const cancelled=(s.statuses.find(x=>x.status==='cancelled')||{n:0}).n;
  $('#kpis').innerHTML=[['Замовлень',fmt(s.orders),'без скасованих'],['Виручка',fmt(s.revenue)+' ₴','без скасованих'],['Середній чек',fmt(s.avg)+' ₴',''],['Скасовано',fmt(cancelled),'не враховано у виручці']]
    .map(([a,b,c])=>`<div class="kpi"><small>${a}</small><b>${b}</b><em>${c||'&nbsp;'}</em></div>`).join('');
  const dl=d=>d.slice(8)+'.'+d.slice(5,7);
  $('#days').innerHTML=bars(s.byDay.map(d=>({v:d.revenue,l:s.byDay.length>9?dl(d.day).slice(0,2):dl(d.day),t:`${dl(d.day)}: ${fmt(d.revenue)} ₴ · ${d.n} зам.`})));
  $('#top').innerHTML=list(s.top.map(t=>({v:t.qty,l:t.name+(t.portion?' · '+t.portion:''),r:t.qty+' шт · '+fmt(t.revenue)+' ₴'})));
  const hrs=Array.from({length:24},(_,h)=>({h,n:(s.byHour.find(x=>x.k===h)||{n:0}).n}));
  const act=hrs.filter(h=>h.n),from=act.length?Math.min(...act.map(h=>h.h)):0,to=act.length?Math.max(...act.map(h=>h.h)):0;
  $('#hours').innerHTML=act.length?bars(hrs.filter(h=>h.h>=from&&h.h<=to).map(h=>({v:h.n,l:h.h,t:`${h.h}:00 — ${h.n} зам.`})),{yellow:1}):'<div class="empty">Даних за цей період ще немає</div>';
  $('#modes').innerHTML=list(s.byMode.map(m=>({v:m.n,l:MODE[m.k]||m.k,r:m.n+' · '+fmt(m.revenue)+' ₴'})));
  $('#pays').innerHTML=list(s.byPay.map(m=>({v:m.n,l:PAY[m.k]||m.k,r:m.n+' · '+fmt(m.revenue)+' ₴'})));
  $('#recent').innerHTML=s.recent.length?s.recent.map(o=>{const d=new Date(o.ts);return `<div class="row"><span><b>№${esc(o.no)}</b> · ${esc(o.name)}<br><span class="muted">${d.toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${MODE[o.mode]||''}</span></span><span style="text-align:right"><span class="n">${fmt(o.total)} ₴</span><br><span class="badge ${esc(o.status)}">${ST[o.status]||o.status}</span></span></div>`}).join(''):'<div class="empty">Замовлень поки немає</div>';
}

$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  $('#range').classList.toggle('show',b.dataset.d==='r');
  if(b.dataset.d==='r'){$('#f').value=range.from;$('#t').value=range.to;return}
  setRange(b.dataset.d);load();
});
$('#rgo').onclick=()=>{if($('#f').value&&$('#t').value){range={from:$('#f').value,to:$('#t').value};load()}};
$('#go').onclick=()=>{put('api',$('#api').value.trim());put('key',$('#key').value);setRange('0');load()};
$('#out').onclick=()=>{put('key','');put('api','');location.reload()};
$('#csv').onclick=()=>{
  if(!last)return;
  const rows=[['Дата','Замовлень','Виручка, грн'],...last.byDay.map(d=>[d.day,d.n,d.revenue])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'}));
  a.download=`norma-stats-${last.from}_${last.to}.csv`;a.click();
};
{const q=new URLSearchParams(location.search).get('api');if(q)put('api',q)}
$('#api').value=get('api');
if(get('api')&&get('key')){setRange('0');load()}
</script>
</body>
</html>
